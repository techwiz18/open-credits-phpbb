services:
    techwiz18.opencredits.transact:
        class: techwiz18\opencredits\service\transact
        arguments:
            - '@dbal.conn'
            - '%core.table_prefix%'
    techwiz18.opencredits.listener:
        class: techwiz18\opencredits\event\main_listener
        arguments:
            - '@techwiz18.opencredits.transact'
            - '@auth'
            - '@template'
            - '@user'
            - '%core.root_path%'
            - '%core.php_ext%'
        tags:
            - { name: event.listener }
    techwiz18.opencredits.command.rebuild:
        class: techwiz18\opencredits\console\command\rebuild
        arguments:
            - '@user'
            - '@techwiz18.opencredits.transact'
        tags:
            - { name: console.command }
