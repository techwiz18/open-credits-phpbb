<!-- INCLUDE ucp_header.html -->

<h2>{OC_PAGE_TITLE}</h2>

<div class="panel">
    <div class="inner">

    <!-- IF ERROR --><p class="error">{ERROR}</p><!-- ENDIF -->

    <!-- IF S_OC_HISTORY -->
        <!-- IF .history -->
        <table class="table1">
        <thead>
        <tr>
            <th>{L_OC_HISTORY_AMOUNT}</th>
            <th>{L_OC_HISTORY_WHAT}</th>
            <th>{L_OC_HISTORY_NOTE}</th>
            <th>{L_OC_HISTORY_WHEN}</th>
        </tr>
        </thead>
        <tbody>
        <!-- BEGIN history -->
        <tr class="<!-- IF history.S_ROW_COUNT is even -->bg1<!-- ELSE -->bg2<!-- ENDIF -->">
            <td>{history.AMOUNT}</td>
            <td>{history.TRIGGER}</td>
            <td>{history.NOTE}</td>
            <td>{history.TIME}</td>
        </tr>
        <!-- END history -->
        </tbody>
        </table>
        <!-- IF .pagination -->
        <div class="pagination">{PAGE_NUMBER} &bull; <!-- BEGIN pagination --><!-- IF pagination.S_IS_PREV --><a href="{pagination.PAGE_URL}">{L_PREVIOUS}</a><!-- ELSEIF pagination.S_IS_CURRENT --> {pagination.PAGE_NUMBER} <!-- ELSEIF pagination.S_IS_NEXT --><a href="{pagination.PAGE_URL}">{L_NEXT}</a><!-- ELSE --><a href="{pagination.PAGE_URL}">{pagination.PAGE_NUMBER}</a><!-- ENDIF --><!-- END pagination --></div>
        <!-- ENDIF -->
        <!-- ELSE -->
        <p>{L_OC_HISTORY_EMPTY}</p>
        <!-- ENDIF -->
    <!-- ENDIF -->

    <!-- IF S_OC_TRANSFER -->
        <form id="oc_transfer" method="post" action="{S_FORM_ACTION}">
        <fieldset>
        <dl>
            <dt><label for="oc_recipient">{L_OC_TRANSFER_TO}{L_COLON}</label></dt>
            <dd><input type="text" id="oc_recipient" name="oc_recipient" value="{OC_RECIPIENT}" class="inputbox" /></dd>
        </dl>
        <dl>
            <dt><label for="oc_currency">{L_OC_TRANSFER_CURRENCY}{L_COLON}</label></dt>
            <dd><select id="oc_currency" name="oc_currency"><!-- BEGIN currencies --><option value="{currencies.ID}"<!-- IF currencies.SELECTED --> selected="selected"<!-- ENDIF -->>{currencies.NAME} ({currencies.BALANCE})</option><!-- END currencies --></select></dd>
        </dl>
        <dl>
            <dt><label for="oc_amount">{L_OC_TRANSFER_AMOUNT}{L_COLON}</label></dt>
            <dd><input type="text" id="oc_amount" name="oc_amount" value="{OC_AMOUNT}" class="inputbox narrow" /></dd>
        </dl>
        </fieldset>
        <fieldset class="submit-buttons">
            {S_FORM_TOKEN}
            <input type="submit" name="oc_transfer" value="{L_OC_TRANSFER_SUBMIT}" class="button1" />
        </fieldset>
        </form>
    <!-- ENDIF -->

    </div>
</div>

<!-- INCLUDE ucp_footer.html -->
